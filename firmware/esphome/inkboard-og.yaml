substitutions:
  device_name: inkboard-og
  friendly_name: Inkboard OG
  firmware_version: "0.4.0"
  sleep_duration: 15min
  awake_refresh_interval: 15min
  sleep_delay: 20s
  maintenance_restore_mode: RESTORE_DEFAULT_ON
  controller_url: !secret inkboard_controller_url
  device_api_token: !secret inkboard_device_api_token

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: inkboard.seeed-ee04
    version: "${firmware_version}"
  on_boot:
    - priority: 700
      then:
        - output.turn_on: display_enable
        - deep_sleep.prevent: deep_sleep_control
    - priority: -100
      then:
        - wait_until:
            condition:
              wifi.connected:
            timeout: 30s
        - if:
            condition:
              wifi.connected:
            then:
              - script.execute: sample_battery
              - script.wait: sample_battery
              - if:
                  condition:
                    lambda: return id(pending_button_event) != "none";
                  then:
                    - logger.log: "Woke from a key; requesting the matching screen"
                    - script.execute:
                        id: request_screen
                        action: !lambda return id(pending_button_event);
                  else:
                    - logger.log: "Wi-Fi and telemetry are ready; requesting the latest image"
                    - component.update: controller_image
            else:
              - logger.log:
                  level: ERROR
                  format: "Wi-Fi did not connect before the image request timeout"
              - script.execute: schedule_sleep

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:

api:
  encryption:
    key: !secret inkboard_api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret inkboard_fallback_password

captive_portal:

http_request:
  timeout: 15s
  useragent: "Inkboard ESPHome/${firmware_version}"

output:
  - platform: gpio
    id: display_enable
    pin: GPIO43

  - platform: gpio
    id: battery_measure_enable
    pin: GPIO6

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

image:
  - platform: online_image
    id: controller_image
    url: "${controller_url}/api/v1/device/image.bmp?device=${device_name}"
    request_headers:
      Authorization: "Bearer ${device_api_token}"
    format: BMP
    type: BINARY
    resize: 800x480
    update_interval: never
    on_download_finished:
      - if:
          condition:
            lambda: return cached;
          then:
            - logger.log: "Image is unchanged; skipping panel refresh"
            - script.execute:
                id: send_check_in
                display_result: "not_modified"
                button_event: !lambda return id(pending_button_event);
            - script.execute: schedule_sleep
          else:
            - logger.log: "Downloaded a new image; refreshing the panel"
            - component.update: epaper_display
            - delay: 7s
            - script.execute:
                id: send_check_in
                display_result: "displayed"
                button_event: !lambda return id(pending_button_event);
            - script.execute: schedule_sleep
    on_error:
      - logger.log:
          level: ERROR
          format: "Unable to download the Inkboard image"
      - script.execute:
          id: send_check_in
          display_result: "download_failed"
          button_event: !lambda return id(pending_button_event);
      - script.execute: schedule_sleep

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    update_interval: never
    lambda: |-
      it.image(0, 0, id(controller_image), Color::BLACK, Color::WHITE);

binary_sensor:
  - platform: gpio
    id: key_previous
    name: "${friendly_name} Previous"
    pin:
      number: GPIO2
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - logger.log: "KEY1 pressed; showing the previous screen"
      - script.execute:
          id: request_screen
          action: "previous"

  - platform: gpio
    id: key_refresh
    name: "${friendly_name} Refresh"
    pin:
      number: GPIO3
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - logger.log: "KEY2 pressed; checking for a new image"
      - script.execute:
          id: request_screen
          action: "refresh"

  - platform: gpio
    id: key_next
    name: "${friendly_name} Next"
    pin:
      number: GPIO5
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - logger.log: "KEY3 pressed; showing the next screen"
      - script.execute:
          id: request_screen
          action: "next"

button:
  - platform: template
    name: "${friendly_name} Previous Screen"
    icon: mdi:chevron-left
    on_press:
      - script.execute:
          id: request_screen
          action: "previous"

  - platform: template
    name: "${friendly_name} Next Screen"
    icon: mdi:chevron-right
    on_press:
      - script.execute:
          id: request_screen
          action: "next"

  - platform: template
    name: "${friendly_name} Refresh Display"
    icon: mdi:refresh
    on_press:
      - script.execute:
          id: request_screen
          action: "refresh"

  - platform: template
    name: "${friendly_name} Force Redraw"
    icon: mdi:monitor-refresh
    entity_category: diagnostic
    on_press:
      - component.update: epaper_display

switch:
  - platform: template
    id: maintenance_mode
    name: "${friendly_name} Maintenance Mode"
    icon: mdi:tools
    optimistic: true
    restore_mode: ${maintenance_restore_mode}
    entity_category: config
    turn_on_action:
      - deep_sleep.prevent: deep_sleep_control
    turn_off_action:
      - deep_sleep.allow: deep_sleep_control
      - script.execute: schedule_sleep

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "${friendly_name} Wi-Fi Signal"
    update_interval: 60s

  - platform: adc
    id: battery_voltage
    name: "${friendly_name} Battery Voltage"
    pin: GPIO1
    attenuation: auto
    update_interval: never
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
    on_value:
      - output.turn_off: battery_measure_enable

text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"

globals:
  - id: wake_reason
    type: std::string
    restore_value: false
    initial_value: '"cold_boot"'

  - id: pending_button_event
    type: std::string
    restore_value: false
    initial_value: '"none"'

script:
  - id: sample_battery
    mode: restart
    then:
      - output.turn_on: battery_measure_enable
      - delay: 100ms
      - component.update: battery_voltage
      - delay: 100ms
      - output.turn_off: battery_measure_enable

  # Reports a key press first so the controller can change screens or bypass quiet hours,
  # then downloads the resulting image. `action` is previous, next, or refresh.
  - id: request_screen
    mode: single
    parameters:
      action: string
    then:
      - lambda: id(pending_button_event) = action;
      - script.execute: sample_battery
      - script.wait: sample_battery
      - script.execute:
          id: send_check_in
          display_result: "button"
          button_event: !lambda return action;
      - script.wait: send_check_in
      - component.update: controller_image

  - id: send_check_in
    mode: queued
    max_runs: 4
    parameters:
      display_result: string
      button_event: string
    then:
      - http_request.post:
          url: "${controller_url}/api/v1/device/check-in"
          request_headers:
            Authorization: "Bearer ${device_api_token}"
            Content-Type: application/json
          capture_response: true
          json: |-
            root["deviceId"] = "${device_name}";
            root["firmwareVersion"] = "${firmware_version}";
            root["model"] = "seeed-ee04-800x480-mono";
            root["width"] = 800;
            root["height"] = 480;
            root["wakeReason"] = id(wake_reason);
            if (!isnan(id(wifi_rssi).state)) {
              root["wifiRssi"] = id(wifi_rssi).state;
            }
            if (!isnan(id(battery_voltage).state)) {
              root["batteryVoltage"] = id(battery_voltage).state;
            }
            root["buttonEvent"] = button_event;
            root["displayResult"] = display_result;
          on_response:
            then:
              - logger.log:
                  format: "Controller check-in returned HTTP %d"
                  args:
                    - response->status_code
              # Sleep until the controller's next scheduled change (60 s to 12 h).
              - lambda: |-
                  if (response->status_code != 200) {
                    return;
                  }
                  json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["nextRefreshSeconds"].is<uint32_t>()) {
                      return false;
                    }
                    uint32_t seconds = root["nextRefreshSeconds"].as<uint32_t>();
                    seconds = std::max<uint32_t>(60, std::min<uint32_t>(seconds, 43200));
                    id(deep_sleep_control).set_sleep_duration(seconds * 1000UL);
                    ESP_LOGI("inkboard", "Next scheduled check-in in %u seconds", (unsigned) seconds);
                    return true;
                  });
          on_error:
            then:
              - logger.log:
                  level: ERROR
                  format: "Unable to report the device check-in"
      - lambda: id(pending_button_event) = "none";

  - id: schedule_sleep
    mode: restart
    then:
      - delay: ${sleep_delay}
      - if:
          condition:
            switch.is_off: maintenance_mode
          then:
            - logger.log: "Maintenance mode is off; entering deep sleep"
            - online_image.release: controller_image
            - output.turn_off: display_enable
            - deep_sleep.enter: deep_sleep_control

deep_sleep:
  id: deep_sleep_control
  sleep_duration: ${sleep_duration}
  on_wake:
    - lambda: |-
        if (cause == deep_sleep::WAKEUP_CAUSE_TIMER) {
          id(wake_reason) = "timer";
        } else {
          id(wake_reason) = "unknown";
        }
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - pin:
          number: GPIO2
          allow_other_uses: true
        on_wake:
          - lambda: |-
              id(wake_reason) = "key1";
              id(pending_button_event) = "previous";
      - pin:
          number: GPIO3
          allow_other_uses: true
        on_wake:
          - lambda: |-
              id(wake_reason) = "key2";
              id(pending_button_event) = "refresh";
      - pin:
          number: GPIO5
          allow_other_uses: true
        on_wake:
          - lambda: |-
              id(wake_reason) = "key3";
              id(pending_button_event) = "next";

interval:
  - interval: 2min
    then:
      - if:
          condition:
            switch.is_off: maintenance_mode
          then:
            - logger.log: "Maximum awake duration reached; entering deep sleep"
            - output.turn_off: display_enable
            - deep_sleep.enter: deep_sleep_control

  # While maintenance mode keeps the device awake, keep the panel current so screen
  # rotation and clocks still advance.
  - interval: ${awake_refresh_interval}
    then:
      - if:
          condition:
            switch.is_on: maintenance_mode
          then:
            - logger.log: "Periodic refresh while awake"
            - lambda: id(pending_button_event) = "none";
            - script.execute: sample_battery
            - script.wait: sample_battery
            - component.update: controller_image
