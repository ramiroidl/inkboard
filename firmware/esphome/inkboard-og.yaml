substitutions:
  device_name: inkboard-og
  friendly_name: Inkboard OG
  firmware_version: "0.6.0"
  sleep_duration: 15min
  awake_refresh_interval: 15min
  # Time awake after a refresh before sleeping; long enough to finish the check-in.
  sleep_delay: 5s
  # Maintenance mode is off after flashing and turns itself off after this long, so a
  # forgotten switch cannot keep the display awake until the battery is empty.
  maintenance_restore_mode: RESTORE_DEFAULT_OFF
  maintenance_timeout: 30min
  # Status icons drawn over the last screen when the controller cannot be reached.
  offline_wifi: "1"
  offline_controller: "2"
  frame_bytes: "48000"
  controller_url: !secret inkboard_controller_url
  device_api_token: !secret inkboard_device_api_token

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: inkboard.seeed-ee04
    version: "${firmware_version}"
  on_boot:
    - priority: 700
      then:
        - output.turn_on: display_enable
        - deep_sleep.prevent: deep_sleep_control
    - priority: -200
      then:
        - globals.set:
            id: boot_complete
            value: "true"
        - script.execute: awake_guard
        # A restored maintenance mode still times out.
        - if:
            condition:
              switch.is_on: maintenance_mode
            then:
              - script.execute: maintenance_timeout
    - priority: -100
      then:
        - wait_until:
            condition:
              wifi.connected:
            timeout: 30s
        - if:
            condition:
              wifi.connected:
            then:
              - script.execute: sample_battery
              - script.wait: sample_battery
              - if:
                  condition:
                    lambda: return id(pending_button_event) != "none";
                  then:
                    - logger.log: "Woke from a key; requesting the matching screen"
                    - script.execute:
                        id: request_screen
                        action: !lambda return id(pending_button_event);
                  else:
                    - logger.log: "Wi-Fi and telemetry are ready; checking for a new image"
                    - script.execute: fetch_image
            else:
              - logger.log:
                  level: ERROR
                  format: "Wi-Fi did not connect before the image request timeout"
              - script.execute:
                  id: show_offline
                  reason: ${offline_wifi}
              - script.wait: show_offline
              - script.execute: schedule_sleep

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:

api:
  encryption:
    key: !secret inkboard_api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret inkboard_fallback_password

captive_portal:

http_request:
  timeout: 15s
  useragent: "Inkboard ESPHome/${firmware_version}"

output:
  - platform: gpio
    id: display_enable
    pin: GPIO43

  - platform: gpio
    id: battery_measure_enable
    pin: GPIO6

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

image:
  - platform: online_image
    id: controller_image
    url: "${controller_url}/api/v1/device/image.bmp?device=${device_name}"
    request_headers:
      Authorization: "Bearer ${device_api_token}"
    format: BMP
    type: BINARY
    resize: 800x480
    update_interval: never
    on_download_finished:
      - if:
          condition:
            lambda: return cached;
          then:
            - logger.log: "Image is unchanged; skipping panel refresh"
            - script.execute:
                id: send_check_in
                display_result: "not_modified"
                button_event: !lambda return id(pending_button_event);
            - script.execute: schedule_sleep
          else:
            - logger.log: "Downloaded a new image; refreshing the panel"
            - globals.set:
                id: offline_reason
                value: "0"
            - component.update: epaper_display
            - script.execute: save_frame
            - delay: 7s
            - script.execute:
                id: send_check_in
                display_result: "displayed"
                button_event: !lambda return id(pending_button_event);
            - script.execute: schedule_sleep
    on_error:
      - logger.log:
          level: ERROR
          format: "Unable to download the Inkboard image"
      - lambda: id(last_etag)[0] = '\0';
      - script.execute:
          id: show_offline
          reason: ${offline_controller}
      - script.wait: show_offline
      - script.execute:
          id: send_check_in
          display_result: "download_failed"
          button_event: !lambda return id(pending_button_event);
      - script.execute: schedule_sleep

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    update_interval: never
    lambda: |-
      if (id(offline_reason) == 0) {
        it.image(0, 0, id(controller_image), Color::BLACK, Color::WHITE);
        return;
      }
      // Offline: redraw the last screen saved in flash, then a status icon by the battery.
      it.fill(Color::WHITE);
      auto *frame = new (std::nothrow) std::array<uint8_t, ${frame_bytes}>();
      if (frame != nullptr) {
        auto pref = global_preferences->make_preference<std::array<uint8_t, ${frame_bytes}>>(
            fnv1_hash("inkboard_frame"));
        if (pref.load(frame)) {
          for (int y = 0; y < 480; y++) {
            const uint8_t *row = frame->data() + y * 100;
            for (int x = 0; x < 800; x++) {
              if (row[x >> 3] & (0x80 >> (x & 7))) {
                it.draw_pixel_at(x, y, Color::BLACK);
              }
            }
          }
        }
        delete frame;
      }
      // Icon box sits left of the battery badge, at the badge's height.
      const int left = 660, top = 455, w = 26, h = 22;
      it.filled_rectangle(left - 2, top - 1, w + 4, h + 2, Color::WHITE);
      const int cx = left + w / 2, cy = top + h - 2;
      if (id(offline_reason) == ${offline_wifi}) {
        // Wi-Fi arcs with a slash.
        for (int y = top; y < top + h; y++) {
          for (int x = left; x < left + w; x++) {
            const int dx = x - cx, dy = cy - y;
            if (dy < 0 || std::abs(dx) > dy) continue;
            const float r = std::sqrt(float(dx * dx + dy * dy));
            if (r <= 2.6f || std::fabs(r - 7.0f) <= 1.4f || std::fabs(r - 12.0f) <= 1.4f ||
                std::fabs(r - 17.0f) <= 1.4f) {
              it.draw_pixel_at(x, y, Color::BLACK);
            }
          }
        }
        for (int y = top; y < top + h; y++) {
          const int x = left + (y - top) * w / h;
          it.draw_pixel_at(x - 1, y, Color::WHITE);
          it.draw_pixel_at(x, y, Color::BLACK);
          it.draw_pixel_at(x + 1, y, Color::BLACK);
        }
      } else {
        // Warning triangle: Wi-Fi works but the controller did not answer.
        for (int y = top; y < top + h; y++) {
          const int half = (y - top) * 12 / h;
          for (int x = cx - half; x <= cx + half; x++) {
            if (y >= top + h - 2 || std::abs(x - cx) > half - 2) it.draw_pixel_at(x, y, Color::BLACK);
          }
        }
        it.filled_rectangle(cx - 1, top + 7, 3, 7, Color::BLACK);
        it.filled_rectangle(cx - 1, top + 16, 3, 2, Color::BLACK);
      }
binary_sensor:
  - platform: gpio
    id: key_previous
    name: "${friendly_name} Previous"
    pin:
      number: GPIO2
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - logger.log: "KEY1 pressed; showing the previous screen"
      - script.execute:
          id: request_screen
          action: "previous"

  - platform: gpio
    id: key_refresh
    name: "${friendly_name} Refresh"
    pin:
      number: GPIO3
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - logger.log: "KEY2 pressed; checking for a new image"
      - script.execute:
          id: request_screen
          action: "refresh"

  - platform: gpio
    id: key_next
    name: "${friendly_name} Next"
    pin:
      number: GPIO5
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - logger.log: "KEY3 pressed; showing the next screen"
      - script.execute:
          id: request_screen
          action: "next"

button:
  - platform: template
    name: "${friendly_name} Previous Screen"
    icon: mdi:chevron-left
    on_press:
      - script.execute:
          id: request_screen
          action: "previous"

  - platform: template
    name: "${friendly_name} Next Screen"
    icon: mdi:chevron-right
    on_press:
      - script.execute:
          id: request_screen
          action: "next"

  - platform: template
    name: "${friendly_name} Refresh Display"
    icon: mdi:refresh
    on_press:
      - script.execute:
          id: request_screen
          action: "refresh"

  - platform: template
    name: "${friendly_name} Force Redraw"
    icon: mdi:monitor-refresh
    entity_category: diagnostic
    on_press:
      - component.update: epaper_display

switch:
  - platform: template
    id: maintenance_mode
    name: "${friendly_name} Maintenance Mode"
    icon: mdi:tools
    optimistic: true
    restore_mode: ${maintenance_restore_mode}
    entity_category: config
    turn_on_action:
      - deep_sleep.prevent: deep_sleep_control
      - script.execute: maintenance_timeout
    turn_off_action:
      - script.stop: maintenance_timeout
      - deep_sleep.allow: deep_sleep_control
      # Restoring the switch at boot also runs this action; only sleep after a real change,
      # otherwise every wake would sleep before Wi-Fi connects and the panel refreshes.
      - if:
          condition:
            lambda: return id(boot_complete);
          then:
            - script.execute: schedule_sleep

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "${friendly_name} Wi-Fi Signal"
    update_interval: 60s

  - platform: adc
    id: battery_voltage
    name: "${friendly_name} Battery Voltage"
    pin: GPIO1
    attenuation: auto
    update_interval: never
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
    on_value:
      - output.turn_off: battery_measure_enable

text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"

globals:
  # What the panel is drawing: 0 for the controller image, otherwise an offline reason.
  - id: offline_reason
    type: int
    restore_value: false
    initial_value: "0"

  # The offline icon already on the panel, kept across deep sleep so an outage redraws once.
  - id: offline_shown
    type: int
    restore_value: true
    initial_value: "0"

  # ETag of the image on the panel, kept across deep sleep so unchanged screens are skipped.
  - id: last_etag
    type: std::array<char, 128>
    restore_value: true
    initial_value: "std::array<char, 128>{}"

  - id: boot_complete
    type: bool
    restore_value: false
    initial_value: "false"

  - id: wake_reason
    type: std::string
    restore_value: false
    initial_value: '"cold_boot"'

  - id: pending_button_event
    type: std::string
    restore_value: false
    initial_value: '"none"'

script:
  - id: sample_battery
    mode: restart
    then:
      - output.turn_on: battery_measure_enable
      - delay: 100ms
      - component.update: battery_voltage
      - delay: 100ms
      - output.turn_off: battery_measure_enable

  # Reports a key press first so the controller can change screens or bypass quiet hours,
  # then downloads the resulting image. `action` is previous, next, or refresh.
  - id: request_screen
    mode: single
    parameters:
      action: string
    then:
      - lambda: id(pending_button_event) = action;
      # A key that wakes the display is still held when its sensor starts, before Wi-Fi
      # connects; requesting immediately would fail and send the display back to sleep.
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - script.execute: sample_battery
      - script.wait: sample_battery
      - script.execute:
          id: send_check_in
          display_result: "button"
          button_event: !lambda return action;
      - script.wait: send_check_in
      # A key always redraws, even when the screen did not change.
      - lambda: id(last_etag)[0] = '\0';
      - script.execute: fetch_image

  # Asks for the image with the ETag on the panel. An unchanged screen (304) skips the
  # download and the panel refresh; otherwise online_image downloads and draws it.
  - id: fetch_image
    mode: single
    then:
      - http_request.get:
          url: "${controller_url}/api/v1/device/image.bmp?device=${device_name}"
          request_headers:
            Authorization: "Bearer ${device_api_token}"
            If-None-Match: !lambda return id(last_etag).data();
          collect_headers:
            - etag
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 304;
                  then:
                    - logger.log: "Screen is unchanged; skipping the panel refresh"
                    - globals.set:
                        id: offline_shown
                        value: "0"
                    - script.execute:
                        id: send_check_in
                        display_result: "not_modified"
                        button_event: !lambda return id(pending_button_event);
                    - script.execute: schedule_sleep
                  else:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - lambda: |-
                              std::string etag = response->get_response_header("etag");
                              auto &stored = id(last_etag);
                              const size_t length = std::min(etag.size(), stored.size() - 1);
                              std::copy_n(etag.begin(), length, stored.begin());
                              stored[length] = '\0';
                          - component.update: controller_image
                        else:
                          - logger.log:
                              level: ERROR
                              format: "Controller image request returned HTTP %d"
                              args:
                                - response->status_code
                          - lambda: id(last_etag)[0] = '\0';
                          - script.execute:
                              id: show_offline
                              reason: ${offline_controller}
                          - script.wait: show_offline
                          - script.execute:
                              id: send_check_in
                              display_result: "download_failed"
                              button_event: !lambda return id(pending_button_event);
                          - script.execute: schedule_sleep
          on_error:
            then:
              - logger.log:
                  level: ERROR
                  format: "Unable to reach the controller"
              - lambda: id(last_etag)[0] = '\0';
              - script.execute:
                  id: show_offline
                  reason: !lambda |-
                    return wifi::global_wifi_component->is_connected() ? ${offline_controller}
                                                                       : ${offline_wifi};
              - script.wait: show_offline
              - script.execute:
                  id: send_check_in
                  display_result: "download_failed"
                  button_event: !lambda return id(pending_button_event);
              - script.execute: schedule_sleep

  # Keeps the drawn screen in flash so an outage can redraw it with a status icon.
  - id: save_frame
    mode: single
    then:
      - lambda: |-
          auto *image = id(controller_image);
          const uint8_t *data = image->get_data_start();
          if (data == nullptr || image->get_width() != 800 || image->get_height() != 480 ||
              image->get_bpp() != 1) {
            ESP_LOGW("inkboard", "Image is not an 800x480 bitmap; not saving it");
            return;
          }
          auto pref = global_preferences->make_preference<std::array<uint8_t, ${frame_bytes}>>(
              fnv1_hash("inkboard_frame"));
          pref.save(reinterpret_cast<const std::array<uint8_t, ${frame_bytes}> *>(data));
          id(offline_shown) = 0;

  # Redraws the saved screen with an offline icon, once per outage and reason.
  - id: show_offline
    mode: single
    parameters:
      reason: int
    then:
      - if:
          condition:
            lambda: return id(offline_shown) != reason;
          then:
            - logger.log:
                format: "Showing offline status %d"
                args:
                  - reason
            - globals.set:
                id: offline_reason
                value: !lambda return reason;
            - component.update: epaper_display
            - globals.set:
                id: offline_reason
                value: "0"
            - globals.set:
                id: offline_shown
                value: !lambda return reason;

  - id: send_check_in
    mode: queued
    max_runs: 4
    parameters:
      display_result: string
      button_event: string
    then:
      - http_request.post:
          url: "${controller_url}/api/v1/device/check-in"
          request_headers:
            Authorization: "Bearer ${device_api_token}"
            Content-Type: application/json
          capture_response: true
          json: |-
            root["deviceId"] = "${device_name}";
            root["firmwareVersion"] = "${firmware_version}";
            root["model"] = "seeed-ee04-800x480-mono";
            root["width"] = 800;
            root["height"] = 480;
            root["wakeReason"] = id(wake_reason);
            if (!isnan(id(wifi_rssi).state)) {
              root["wifiRssi"] = id(wifi_rssi).state;
            }
            if (!isnan(id(battery_voltage).state)) {
              root["batteryVoltage"] = id(battery_voltage).state;
            }
            root["buttonEvent"] = button_event;
            root["displayResult"] = display_result;
          on_response:
            then:
              - logger.log:
                  format: "Controller check-in returned HTTP %d"
                  args:
                    - response->status_code
              # Sleep until the controller's next scheduled change (60 s to 12 h).
              - lambda: |-
                  if (response->status_code != 200) {
                    return;
                  }
                  json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["nextRefreshSeconds"].is<uint32_t>()) {
                      return false;
                    }
                    uint32_t seconds = root["nextRefreshSeconds"].as<uint32_t>();
                    seconds = std::max<uint32_t>(60, std::min<uint32_t>(seconds, 43200));
                    id(deep_sleep_control).set_sleep_duration(seconds * 1000UL);
                    ESP_LOGI("inkboard", "Next scheduled check-in in %u seconds", (unsigned) seconds);
                    return true;
                  });
          on_error:
            then:
              - logger.log:
                  level: ERROR
                  format: "Unable to report the device check-in"
      - lambda: id(pending_button_event) = "none";

  # Limits each wake to 2 minutes so a failed request cannot drain the battery. This must be
  # a one-shot delay from boot: an `interval` would first run within 5 s of boot and put the
  # display to sleep before it refreshes.
  - id: awake_guard
    mode: single
    then:
      - delay: 2min
      - if:
          condition:
            switch.is_off: maintenance_mode
          then:
            - logger.log: "Maximum awake duration reached; entering deep sleep"
            - output.turn_off: display_enable
            - deep_sleep.enter: deep_sleep_control

  - id: maintenance_timeout
    mode: restart
    then:
      - delay: ${maintenance_timeout}
      - logger.log: "Maintenance mode timed out; turning it off"
      - switch.turn_off: maintenance_mode

  - id: schedule_sleep
    mode: restart
    then:
      - delay: ${sleep_delay}
      - if:
          condition:
            switch.is_off: maintenance_mode
          then:
            - logger.log: "Maintenance mode is off; entering deep sleep"
            - online_image.release: controller_image
            - output.turn_off: display_enable
            - deep_sleep.enter: deep_sleep_control

deep_sleep:
  id: deep_sleep_control
  sleep_duration: ${sleep_duration}
  on_wake:
    - lambda: |-
        if (cause == deep_sleep::WAKEUP_CAUSE_TIMER) {
          id(wake_reason) = "timer";
        } else {
          id(wake_reason) = "unknown";
        }
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - pin:
          number: GPIO2
          allow_other_uses: true
        on_wake:
          - lambda: |-
              id(wake_reason) = "key1";
              id(pending_button_event) = "previous";
      - pin:
          number: GPIO3
          allow_other_uses: true
        on_wake:
          - lambda: |-
              id(wake_reason) = "key2";
              id(pending_button_event) = "refresh";
      - pin:
          number: GPIO5
          allow_other_uses: true
        on_wake:
          - lambda: |-
              id(wake_reason) = "key3";
              id(pending_button_event) = "next";

interval:
  # While maintenance mode keeps the device awake, keep the panel current so screen
  # rotation and clocks still advance. ESPHome runs an interval within 5 s of boot unless
  # it has a startup delay, and the boot sequence already requests an image.
  - interval: ${awake_refresh_interval}
    startup_delay: ${awake_refresh_interval}
    then:
      - if:
          condition:
            switch.is_on: maintenance_mode
          then:
            - logger.log: "Periodic refresh while awake"
            - lambda: id(pending_button_event) = "none";
            - script.execute: sample_battery
            - script.wait: sample_battery
            - script.execute: fetch_image
