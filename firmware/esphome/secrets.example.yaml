wifi_ssid: "Your 2.4 GHz network"
wifi_password: "your-wifi-password"

# Generate this in ESPHome Device Builder when creating the device.
inkboard_api_encryption_key: "replace-with-a-base64-32-byte-api-key"

# At least eight characters. Used only by the fallback setup access point.
inkboard_fallback_password: "change-me-please"

# Use the controller computer's LAN address, not localhost.
inkboard_controller_url: "http://192.168.1.50:8099"

# Must exactly match INKBOARD_DEVICE_API_TOKEN on the controller.
inkboard_device_api_token: "replace-with-at-least-32-random-characters"
